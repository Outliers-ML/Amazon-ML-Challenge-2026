# ==========================================
# LightGBM Baseline Configuration
# ==========================================

experiment_name: "lgbm_baseline"

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  submissions_dir: "submissions"
  logs_dir: "logs"

data:
  train_file: "train.csv"
  test_file: "test.csv"
  target_col: "target"
  id_col: "id"

model:
  model_type: "lightgbm"
  early_stopping_rounds: 50
  num_boost_round: 1500
  params:
    learning_rate: 0.03
    num_leaves: 31
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    random_state: 42
    n_jobs: -1

train:
  seed: 42
  n_splits: 5
  stratified: true
  metric: "f1_macro"
  device: "cuda"
