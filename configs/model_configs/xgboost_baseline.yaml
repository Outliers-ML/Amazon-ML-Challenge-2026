# ==========================================
# XGBoost Baseline Configuration
# ==========================================

experiment_name: "xgboost_baseline"

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  submissions_dir: "submissions"
  logs_dir: "logs"

data:
  train_file: "train.csv"
  test_file: "test.csv"
  target_col: "target"
  id_col: "id"

model:
  model_type: "xgboost"
  early_stopping_rounds: 50
  num_boost_round: 1500
  params:
    learning_rate: 0.03
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    random_state: 42

train:
  seed: 42
  n_splits: 5
  stratified: true
  metric: "f1_macro"
  device: "cuda"
