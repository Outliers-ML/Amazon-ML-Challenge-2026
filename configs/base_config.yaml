# ==========================================
# Amazon ML Challenge 2026 - Base Configuration
# ==========================================

experiment_name: "baseline_experiment"

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  submissions_dir: "submissions"
  logs_dir: "logs"

data:
  train_file: "train.csv"
  test_file: "test.csv"
  target_col: "target"
  id_col: "id"
  text_cols: []
  numerical_cols: []
  categorical_cols: []
  image_cols: []

model:
  model_type: "lightgbm"
  early_stopping_rounds: 50
  num_boost_round: 1500
  params:
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

train:
  seed: 42
  n_splits: 5
  stratified: true
  group_col: null
  metric: "f1_macro"
  device: "cuda"
  num_workers: 4
  batch_size: 64
